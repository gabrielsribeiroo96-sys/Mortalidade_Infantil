# Dispara o deploy no Render a cada push no main (via Deploy Hook).
# Configure o secret RENDER_DEPLOY_HOOK com a URL de Settings > Deploy Hook do Render.
name: Deploy no Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK não configurado; deploy não disparado."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
