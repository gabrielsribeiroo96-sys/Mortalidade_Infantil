# Ambiente completo local: docker compose up --build  ->  http://localhost:8000
# Portas ocupadas? Ex.: APP_PORT=8091 MONGO_PORT=27018 docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"

  app:
    build: .
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: mortalidade_infantil
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - mongo

volumes:
  mongo_data:
